name: Build & deploy landing page

# Reusable workflow: builds web/ and publishes it to GitHub Pages.
# Callers must grant: pages: write, id-token: write.
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build. Empty = the ref that triggered the run."
        required: false
        type: string
        default: ""

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
