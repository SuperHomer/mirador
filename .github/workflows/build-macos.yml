name: Build macOS

# macOS is the primary platform and had no CI at all: clippy and the test
# suite only ever ran on Windows, and the .dmg was built by hand at release
# time. This runs both, and produces the release artifact.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-macos.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/build-macos.yml"
  release:
    types: [published]
  workflow_dispatch:

# The build runs `npm ci` and `cargo build`, i.e. dependency build scripts.
# Those must never hold a token that can write to the repository; only the
# release job below gets one, and only on a release event.
permissions:
  contents: read

jobs:
  build:
    # macos-14+ runners are Apple silicon, which is what the .dmg targets.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The app crate's build script wants both of these on disk, so they
      # have to exist before *any* cargo command touches it.
      - name: Typecheck + build frontend
        run: npm run build

      - name: Stage the mira CLI sidecar
        run: npm run build:cli

      - name: Lint (Rust)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (Rust)
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Build app + .dmg
        run: npm run tauri build

      # Unsigned (no Developer ID), so first launch needs right-click → Open.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mirador-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/mira
          if-no-files-found: error

  # Separate job so repo-write lives here and nowhere near the build's
  # dependency graph.
  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mirador-macos
          path: dist

      # Version-free name on purpose — see the note in build-windows.yml.
      - name: Attach the .dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/bundle/dmg/*.dmg Mirador-macOS-arm64.dmg
          gh release upload "${{ github.event.release.tag_name }}" \
            Mirador-macOS-arm64.dmg \
            --repo "${{ github.repository }}" --clobber
