name: Build macOS

# macOS is the primary platform and had no CI at all: clippy and the test
# suite only ever ran on Windows, and the .dmg was built by hand at release
# time. This runs both, and produces the release artifact.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-macos.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-macos.yml"
  release:
    types: [published]
  workflow_dispatch:

# The build runs `npm ci` and `cargo build`, i.e. dependency build scripts.
# Those must never hold a token that can write to the repository; only the
# release job below gets one, and only on a release event.
permissions:
  contents: read

jobs:
  build:
    # macos-14+ runners are Apple silicon, which is what the .dmg targets.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The app crate's build script wants both of these on disk, so they
      # have to exist before *any* cargo command touches it.
      - name: Typecheck + build frontend
        run: npm run build

      - name: Stage the mira CLI sidecar
        run: npm run build:cli

      - name: Lint (Rust)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (Rust)
        working-directory: src-tauri
        run: cargo test --workspace

      # TAURI_SIGNING_PRIVATE_KEY makes the build emit the updater payload
      # (Mirador.app.tar.gz) plus a detached .sig.
      - name: Build app + .dmg
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Dependabot runs read a separate secret store, so this is empty
          # for them; an empty TAURI_SIGNING_PRIVATE_KEY is worse than none,
          # tauri reads it as malformed ("Missing comment in secret key").
          # No key means no update payload — and tauri refuses to build at
          # all rather than emit an unsigned one ("A public key has been
          # found, but no private key"), so the artifacts have to be turned
          # off explicitly. That is the case for every Dependabot run, every
          # fork, and anyone building locally without the secret.
          if [ -n "$UPDATER_KEY" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$UPDATER_KEY"
            npm run tauri build
          else
            npm run tauri build -- \
              --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      # Unsigned (no Developer ID), so first launch needs right-click → Open.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mirador-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/mira
          if-no-files-found: error

  # Separate job so repo-write lives here and nowhere near the build's
  # dependency graph.
  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mirador-macos
          path: dist

      # Version-free name on purpose — see the note in build-windows.yml.
      - name: Attach the .dmg and the update payload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          # Read via os.environ below, never interpolated into the script: a
          # release body is arbitrary text, and `${{ }}` inside a run block
          # would hand a backtick or a quote in it to the shell.
          BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          mv dist/bundle/dmg/*.dmg Mirador-macOS-arm64.dmg
          mv dist/bundle/macos/*.app.tar.gz     Mirador-macOS-arm64.app.tar.gz
          mv dist/bundle/macos/*.app.tar.gz.sig Mirador-macOS-arm64.app.tar.gz.sig

          # The manifest the updater fetches. Keyed by the platform triple the
          # plugin asks for, and pointing at this release's own tag rather than
          # /latest, so a manifest always describes the build it shipped with.
          python3 - <<'PY' > latest-darwin-aarch64.json
          import datetime, json, os, sys
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          sig = open("Mirador-macOS-arm64.app.tar.gz.sig").read().strip()
          json.dump({
              "version": tag.lstrip("v"),
              # The release body itself, so the app can show what changed
              # without a second request to an API that rate-limits by IP.
              # Empty body (a release published before its notes were
              # written) falls back to the link it used to carry.
              "notes": os.environ.get("BODY", "").strip()
                       or f"See https://github.com/{repo}/releases/tag/{tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": {
                      "signature": sig,
                      "url": f"https://github.com/{repo}/releases/download/{tag}/Mirador-macOS-arm64.app.tar.gz",
                  }
              },
          }, sys.stdout, indent=2)
          PY

          gh release upload "$TAG" \
            Mirador-macOS-arm64.dmg \
            Mirador-macOS-arm64.app.tar.gz \
            Mirador-macOS-arm64.app.tar.gz.sig \
            latest-darwin-aarch64.json \
            --repo "$REPO" --clobber
