name: Release

# Build → attach → publish, in that order. The builds used to fire *on*
# `release: published`, so for the length of both builds /releases/latest/
# pointed at a release with no `latest-<target>-<arch>.json`, and every
# running app's update check 404'd. Here the release stays a draft — which
# /releases/latest/ never resolves to — until both platforms' assets and
# manifests are on it, and only then is it published.
#
# To release: commit `Release vX.Y.Z`, then
#   gh release create vX.Y.Z --draft --title "vX.Y.Z — …" --notes-file notes.md
#   git tag vX.Y.Z && git push origin vX.Y.Z
# The draft must exist before the tag is pushed: its body is the What's New
# pane and goes into the update manifests, so notes come first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A second push of the same tag must not race a half-attached draft.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Fails in seconds instead of after two builds. Reading a draft needs
  # contents: write; this job checks out and calls gh, and runs nothing from
  # the dependency graph.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag names the version being built, and a draft is waiting
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The manifest's version comes from the tag and the app compares it
          # with its own, so a tag that disagrees with the build would offer
          # the same update forever.
          version=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match tauri.conf.json version $version"
            exit 1
          fi
          draft=$(gh release view "$TAG" --repo "$REPO" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          if [ "$draft" != "true" ]; then
            echo "::error::expected a draft release for $TAG with its notes written (got: $draft)."
            echo "Create it with: gh release create $TAG --draft --title \"$TAG — …\" --notes-file notes.md"
            exit 1
          fi

  macos:
    needs: preflight
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  windows:
    needs: preflight
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  # Separate jobs so repo-write lives here and nowhere near the builds'
  # dependency graph. Linux — they only move files.
  attach:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mirador-macos
          path: macos

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mirador-windows
          path: windows

      # Version-free names on purpose: that is what makes
      # /releases/latest/download/<name> a permanent link, so the landing
      # page can point straight at the installer and never need updating.
      # The version lives in the release tag.
      - name: Attach installers, update payloads and manifests to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mv macos/bundle/dmg/*.dmg                  Mirador-macOS-arm64.dmg
          mv macos/bundle/macos/*.app.tar.gz         Mirador-macOS-arm64.app.tar.gz
          mv macos/bundle/macos/*.app.tar.gz.sig     Mirador-macOS-arm64.app.tar.gz.sig
          # The updater payload on Windows is the NSIS installer itself, so
          # the same file is both a fresh install and an update; the .sig
          # beside it is what the plugin verifies. (`*.exe` does not match
          # `*.exe.sig`, so the order of these two does not matter.)
          mv windows/bundle/nsis/*-setup.exe.sig     Mirador-Windows-x64-setup.exe.sig
          mv windows/bundle/nsis/*.exe               Mirador-Windows-x64-setup.exe
          mv windows/bundle/msi/*.msi                Mirador-Windows-x64.msi

          # The draft's body, read now rather than from the event: there is
          # no release event any more. Into a file, never through an expression —
          # a release body is arbitrary text and a run block would hand a
          # backtick or a quote in it to the shell.
          gh release view "$TAG" --repo "$REPO" --json body -q .body > body.md

          # One manifest per platform, keyed by the triple the plugin asks
          # for and pointing at this release's own tag rather than /latest,
          # so a manifest always describes the build it shipped with. The
          # notes are the release body itself, so the app can show what
          # changed without a second request to an API that rate-limits by
          # IP; an empty body falls back to the link it used to carry.
          python3 - <<'PY'
          import datetime, json, os
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          body = open("body.md").read().strip()
          notes = body or f"See https://github.com/{repo}/releases/tag/{tag}"
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          base = f"https://github.com/{repo}/releases/download/{tag}"
          for name, platform, payload in [
              ("latest-darwin-aarch64.json", "darwin-aarch64", "Mirador-macOS-arm64.app.tar.gz"),
              ("latest-windows-x86_64.json", "windows-x86_64", "Mirador-Windows-x64-setup.exe"),
          ]:
              sig = open(payload + ".sig").read().strip()
              with open(name, "w") as f:
                  json.dump({
                      "version": tag.lstrip("v"),
                      "notes": notes,
                      "pub_date": now,
                      "platforms": {platform: {"signature": sig, "url": f"{base}/{payload}"}},
                  }, f, indent=2)
          PY

          gh release upload "$TAG" \
            Mirador-macOS-arm64.dmg \
            Mirador-macOS-arm64.app.tar.gz \
            Mirador-macOS-arm64.app.tar.gz.sig \
            latest-darwin-aarch64.json \
            Mirador-Windows-x64-setup.exe \
            Mirador-Windows-x64-setup.exe.sig \
            Mirador-Windows-x64.msi \
            latest-windows-x86_64.json \
            --repo "$REPO" --clobber

  # Last, and only if everything above succeeded. A failed build leaves an
  # unpublished draft nobody's updater can see; re-run the failed jobs.
  publish:
    needs: attach
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest
