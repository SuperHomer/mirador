name: Build Windows

# Mirador is developed on macOS, so Windows is verified here: this job is
# the Windows compiler, test runner, and installer factory. Run it by hand
# from the Actions tab, and automatically on every release (the .exe/.msi
# are attached to the release).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/build-windows.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The app crate's build script wants both of these on disk, so they
      # have to exist before *any* cargo command touches it — not just
      # before `tauri build`, which is what produces them normally.
      - name: Typecheck + build frontend
        run: npm run build

      - name: Stage the mira CLI sidecar
        run: npm run build:cli

      - name: Lint (Rust)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (Rust)
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Build app + installers
        run: npm run tauri build

      # NSIS (per-user, no admin prompt) and MSI, plus the bare CLI for
      # anyone who only wants `mira`.
      - uses: actions/upload-artifact@v4
        with:
          name: mirador-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/mira.exe
          if-no-files-found: error

      - name: Attach installers to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe) `
            (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi) `
            --clobber
