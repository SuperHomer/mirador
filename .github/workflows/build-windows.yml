name: Build Windows

# Mirador is developed on macOS, so Windows is verified here: this job is
# the Windows compiler, test runner, and installer factory. Run it by hand
# from the Actions tab, and automatically on every release (the .exe/.msi
# are attached to the release).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"
  # release.yml calls this on a tag push and does the attaching itself.
  workflow_call:
  workflow_dispatch:

# The build runs `npm ci` and `cargo build`, i.e. dependency build scripts.
# Those must never hold a token that can write to the repository; the jobs
# in release.yml that do write never run any of it.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Pinned by SHA, so the ref no longer names the toolchain the way
      # `@stable` did — it has to be stated explicitly. This still installs
      # whatever is current stable at run time; the pin is on the action.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The app crate's build script wants both of these on disk, so they
      # have to exist before *any* cargo command touches it — not just
      # before `tauri build`, which is what produces them normally.
      - name: Typecheck + build frontend
        run: npm run build

      - name: Stage the mira CLI sidecar
        run: npm run build:cli

      - name: Lint (Rust)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (Rust)
        working-directory: src-tauri
        run: cargo test --workspace

      # See build-macos.yml: the key makes the build emit a signed update
      # payload. On Windows that is the NSIS installer plus its .sig.
      - name: Build app + installers
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # See build-macos.yml. Two differences here: pwsh, not bash, and the
          # override goes through a file rather than inline JSON — PowerShell's
          # native-argument parsing is liable to eat the quotes in
          # `--config '{"...":...}'`, and `--config` accepts a path too.
          if ($env:UPDATER_KEY) {
            $env:TAURI_SIGNING_PRIVATE_KEY = $env:UPDATER_KEY
            npm run tauri build
          } else {
            '{"bundle":{"createUpdaterArtifacts":false}}' |
              Set-Content -Path no-updater.json -Encoding utf8
            npm run tauri build -- --config no-updater.json
          }

      # NSIS (per-user, no admin prompt) and MSI, plus the bare CLI for
      # anyone who only wants `mira`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mirador-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/mira.exe
          if-no-files-found: error
