name: Build Windows

# Mirador is developed on macOS, so Windows is verified here: this job is
# the Windows compiler, test runner, and installer factory. Run it by hand
# from the Actions tab, and automatically on every release (the .exe/.msi
# are attached to the release).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"
  release:
    types: [published]
  workflow_dispatch:

# The build runs `npm ci` and `cargo build`, i.e. dependency build scripts.
# Those must never hold a token that can write to the repository; only the
# release job below gets one, and only on a release event.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Pinned by SHA, so the ref no longer names the toolchain the way
      # `@stable` did — it has to be stated explicitly. This still installs
      # whatever is current stable at run time; the pin is on the action.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The app crate's build script wants both of these on disk, so they
      # have to exist before *any* cargo command touches it — not just
      # before `tauri build`, which is what produces them normally.
      - name: Typecheck + build frontend
        run: npm run build

      - name: Stage the mira CLI sidecar
        run: npm run build:cli

      - name: Lint (Rust)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (Rust)
        working-directory: src-tauri
        run: cargo test --workspace

      # See build-macos.yml: the key makes the build emit a signed update
      # payload. On Windows that is the NSIS installer plus its .sig.
      - name: Build app + installers
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # See build-macos.yml: empty key means do not sign, because tauri
          # fails on an empty one rather than skipping. pwsh here, not bash.
          if ($env:UPDATER_KEY) { $env:TAURI_SIGNING_PRIVATE_KEY = $env:UPDATER_KEY }
          npm run tauri build

      # NSIS (per-user, no admin prompt) and MSI, plus the bare CLI for
      # anyone who only wants `mira`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mirador-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/mira.exe
          if-no-files-found: error

  # Separate job so repo-write lives here and nowhere near the build's
  # dependency graph. Runs on Linux — it only moves files.
  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mirador-windows
          path: dist

      # Uploaded under version-free names on purpose: that is what makes
      # /releases/latest/download/<name> a permanent link, so the landing
      # page can point straight at the installer and never need updating.
      # The version lives in the release tag.
      - name: Attach installers and the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The updater payload on Windows is the NSIS installer itself, so
          # the same file is both a fresh install and an update; the .sig
          # beside it is what the plugin verifies. (`*.exe` does not match
          # `*.exe.sig`, so the order of these two does not matter.)
          mv dist/bundle/nsis/*-setup.exe.sig Mirador-Windows-x64-setup.exe.sig
          mv dist/bundle/nsis/*.exe Mirador-Windows-x64-setup.exe
          mv dist/bundle/msi/*.msi  Mirador-Windows-x64.msi

          # One manifest per platform — macOS publishes its own from the other
          # workflow, so neither has to wait for the other's artifacts.
          python3 - <<'PY' > latest-windows-x86_64.json
          import datetime, json, os, sys
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          sig = open("Mirador-Windows-x64-setup.exe.sig").read().strip()
          json.dump({
              "version": tag.lstrip("v"),
              "notes": f"See https://github.com/{repo}/releases/tag/{tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "windows-x86_64": {
                      "signature": sig,
                      "url": f"https://github.com/{repo}/releases/download/{tag}/Mirador-Windows-x64-setup.exe",
                  }
              },
          }, sys.stdout, indent=2)
          PY

          gh release upload "$TAG" \
            Mirador-Windows-x64-setup.exe \
            Mirador-Windows-x64-setup.exe.sig \
            Mirador-Windows-x64.msi \
            latest-windows-x86_64.json \
            --repo "$REPO" --clobber
