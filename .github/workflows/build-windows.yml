name: Build Windows

# Mirador is developed on macOS, so Windows is verified here: this job is
# the Windows compiler, test runner, and installer factory. Run it by hand
# from the Actions tab, and automatically on every release (the .exe/.msi
# are attached to the release).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/build-windows.yml"
  release:
    types: [published]
  workflow_dispatch:

# The build runs `npm ci` and `cargo build`, i.e. dependency build scripts.
# Those must never hold a token that can write to the repository; only the
# release job below gets one, and only on a release event.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # Pinned by SHA, so the ref no longer names the toolchain the way
      # `@stable` did — it has to be stated explicitly. This still installs
      # whatever is current stable at run time; the pin is on the action.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The app crate's build script wants both of these on disk, so they
      # have to exist before *any* cargo command touches it — not just
      # before `tauri build`, which is what produces them normally.
      - name: Typecheck + build frontend
        run: npm run build

      - name: Stage the mira CLI sidecar
        run: npm run build:cli

      - name: Lint (Rust)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (Rust)
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Build app + installers
        run: npm run tauri build

      # NSIS (per-user, no admin prompt) and MSI, plus the bare CLI for
      # anyone who only wants `mira`.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mirador-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/mira.exe
          if-no-files-found: error

  # Separate job so repo-write lives here and nowhere near the build's
  # dependency graph. Runs on Linux — it only moves files.
  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mirador-windows
          path: dist

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/bundle/nsis/*.exe \
            dist/bundle/msi/*.msi \
            --repo "${{ github.repository }}" --clobber
