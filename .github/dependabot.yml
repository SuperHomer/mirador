version: 2

# Nothing was watching the dependency graph before: a security audit found
# an end-of-life Node in CI and a high-severity transitive advisory that had
# been sitting in the lockfile. These keep both from happening quietly.
updates:
  # The app: React/Vite/xterm.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # React and Vite each ship as a set whose members pin each other's peer
    # ranges, so a lone bump cannot resolve: vite 8 is outside
    # @vitejs/plugin-react 4's peer range, and @types/react 19 will not sit
    # beside @types/react-dom 18. Ungrouped, dependabot opened four PRs
    # that could never go green no matter how often they were rebased.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"

  # The landing page (its own lockfile).
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # React and Vite each ship as a set whose members pin each other's peer
    # ranges, so a lone bump cannot resolve: vite 8 is outside
    # @vitejs/plugin-react 4's peer range, and @types/react 19 will not sit
    # beside @types/react-dom 18. Ungrouped, dependabot opened four PRs
    # that could never go green no matter how often they were rebased.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"

  # Tauri and the Rust workspace.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Workflow actions are currently mutable tags (@v4, @stable); this is what
  # keeps them current if they are ever pinned to commit SHAs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
