[package]
name = "cmux-cli"
version.workspace = true
edition.workspace = true
description = "cmux command-line client (automation over the cmux socket)."

[[bin]]
name = "cmux"
path = "src/main.rs"

[dependencies]
cmux-core = { path = "../cmux-core" }
cmux-protocol = { path = "../cmux-protocol" }
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
