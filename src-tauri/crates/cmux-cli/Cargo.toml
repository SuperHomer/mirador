[package]
name = "cmux-cli"
version.workspace = true
edition.workspace = true
description = "mira: Mirador command-line client (automation over the Mirador socket)."

[[bin]]
name = "mira"
path = "src/main.rs"

[dependencies]
cmux-core = { path = "../cmux-core" }
cmux-protocol = { path = "../cmux-protocol" }
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
