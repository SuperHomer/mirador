[workspace]
members = ["crates/cmux-core", "crates/cmux-protocol", "crates/cmux-cli"]

[workspace.package]
version = "0.1.25"
edition = "2021"
license = "MIT"
authors = ["Yoan Marti"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "cmux-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mirador: a cross-platform terminal for AI coding agent workflows"

[lib]
name = "cmux_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The crate keeps its internal name; the shipped executable is `mirador`
# so the process and code-signing identity match the product.
[[bin]]
name = "mirador"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
notify = "8"
# Already in the tree via tauri-plugin-updater, whose `rustls-tls` supplies
# the TLS stack through feature unification — hence only `blocking` (release
# notes are fetched off the main thread) and `json` here, and no second
# implementation of TLS in the bundle.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
# The updater selects reqwest's `rustls-no-provider`, so the process has no
# default rustls crypto provider until something installs one. `ring` is
# already compiled (rustls-webpki uses it), unlike aws-lc-rs, which would
# want NASM on the Windows runner.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
serde.workspace = true
serde_json.workspace = true
cmux-core = { path = "crates/cmux-core" }
cmux-protocol = { path = "crates/cmux-protocol" }
