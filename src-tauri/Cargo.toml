[workspace]
members = ["crates/cmux-core", "crates/cmux-protocol", "crates/cmux-cli", "crates/cmux-e2e"]

[workspace.package]
version = "0.1.40"
edition = "2021"
license = "MIT"
authors = ["Yoan Marti"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "cmux-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mirador: a cross-platform terminal for AI coding agent workflows"

[lib]
name = "cmux_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The crate keeps its internal name; the shipped executable is `mirador`
# so the process and code-signing identity match the product.
[[bin]]
name = "mirador"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
notify = "8"
# Already in the tree via tauri-plugin-updater, whose `rustls-tls` supplies
# the TLS stack through feature unification — hence only `blocking` (release
# notes are fetched off the main thread) and `json` here, and no second
# implementation of TLS in the bundle.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
# The updater selects reqwest's `rustls-no-provider`, so the process has no
# default rustls crypto provider until something installs one. `ring` is
# already compiled (rustls-webpki uses it), unlike aws-lc-rs, which would
# want NASM on the Windows runner.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
serde.workspace = true
serde_json.workspace = true
cmux-core = { path = "crates/cmux-core" }
cmux-protocol = { path = "crates/cmux-protocol" }
# Screenshots reach the CLI as base64 in the socket's JSON. Already in the
# tree (via reqwest's hyper-util).
base64 = "0.22"

# A browser pane's screenshot: WebKit's snapshot, drawn and encoded here.
# All already in the tree through wry and muda, at these versions.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
# Without their default features, which would pull in every framework
# they bind (Metal, CoreVideo, Security…) as new crates.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-graphics", "NSGraphicsContext", "NSImage", "NSImageRep"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }
png = "0.18"

# WebView2's CapturePreview, into a memory stream.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }
