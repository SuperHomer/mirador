[workspace]
members = ["crates/cmux-core", "crates/cmux-protocol", "crates/cmux-cli"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Yoan Marti"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "cmux-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mirador: a cross-platform terminal for AI coding agent workflows"

[lib]
name = "cmux_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The crate keeps its internal name; the shipped executable is `mirador`
# so the process and code-signing identity match the product.
[[bin]]
name = "mirador"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
notify = "8"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
serde.workspace = true
serde_json.workspace = true
cmux-core = { path = "crates/cmux-core" }
cmux-protocol = { path = "crates/cmux-protocol" }
