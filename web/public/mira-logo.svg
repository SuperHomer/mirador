<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1e2e"></stop>
      <stop offset="100%" stop-color="#11111b"></stop>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"></feGaussianBlur>
      <feGaussianBlur stdDeviation="3" result="blur2"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur1"></feMergeNode>
        <feMergeNode in="blur2"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <linearGradient id="leftBeam" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.45"></stop>
      <stop offset="30%" stop-color="#74c7ec" stop-opacity="0.25"></stop>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.0"></stop>
    </linearGradient>
    <linearGradient id="rightBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.45"></stop>
      <stop offset="30%" stop-color="#74c7ec" stop-opacity="0.25"></stop>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.0"></stop>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#89dceb" stop-opacity="0.25"></stop>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.0"></stop>
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGlow)" stroke="#45475a" stroke-width="4"></rect>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#a6adc8" stroke-width="2" stroke-opacity="0.3"></rect>

  <polygon points="206,140 24,80 24,220" fill="url(#leftBeam)"></polygon>
  <polygon points="306,140 488,80 488,220" fill="url(#rightBeam)"></polygon>

  <circle cx="256" cy="140" r="90" fill="#89b4fa" opacity="0.15" filter="url(#intenseGlow)"></circle>

